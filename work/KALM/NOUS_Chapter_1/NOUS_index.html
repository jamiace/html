{tag:'00 / COLD OPEN',title:'我只是想叫個外送',sub:'一覺醒來，外送平台似乎倒了六百年。',img:"https://miro.medium.com/v2/resize:fit:1400/0*grdtOltLs1Gngd4K",body:`<div class="dialog cinematic"><div class="line npc"><b class="speaker">廣播</b><span>恭喜您！您的長期睡眠計畫已經順利完成！</span></div><div class="line player"><b class="speaker">玩家</b><span>我睡了多久？</span></div><div class="line npc"><b class="speaker">廣播</b><span>您的睡眠品質評分為五顆星！</span></div><div class="line player"><b class="speaker">玩家</b><span>我是問多久！</span></div><div class="line npc"><b class="speaker">廣播</b><span>感謝您的好評。歡迎推薦給親朋好友！</span></div><div class="line player"><b class="speaker">玩家</b><span>……我是不是睡在客服中心？</span></div></div><p class="lead">「啊～～睡得好飽……肚子餓了，叫個 Uber Eats 吧。」</p><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>欸？手機呢？……不對，我在哪裡？</span></div><div class="line"><b class="speaker">廣播</b><span>恭喜完成長期睡眠服務！睡眠品質五顆星！</span></div><div class="line player"><b class="speaker">玩家</b><span>我睡多久？</span></div><div class="line"><b class="speaker">廣播</b><span>感謝您的五星好評！</span></div></div><p class="desc">一座老舊冬眠艙緩緩打開。日期顯示亂碼，聯絡網路完全離線。你唯一確定的事：肚子真的很餓。</p><div class="actions"><button class="action" data-go="1">離開冬眠艙 →</button></div>`},
{tag:'01 / MEMORY FRAGMENT',title:'醒來之前，我在幹嘛？',sub:'第一個選擇不分對錯，只記錄你的反應。',body:`<p class="desc">你努力回想進入冬眠艙前的最後一幕。記憶像被搖壞的汽水，冒出四個不太可靠的念頭。</p><div class="choicegrid" id="memoryChoices"><button class="choice" data-memory="A">A　我是不是參加了人體實驗？</button><button class="choice" data-memory="B">B　我的家人呢？其他人在哪？</button><button class="choice" data-memory="C">C　先找出口，活下來再說。</button><button class="choice" data-memory="D">D　該不會是公司忘記叫我起床？</button></div><div class="status" id="memoryStatus">請選擇一個直覺反應。</div><p class="note">設計意圖：觀察玩家的關注方向，不把玩家永久分類成某種人格。</p>`,gate:'memory'},
{tag:'02 / THE WORLD OUTSIDE',title:'世界……是不是有點壞掉了？',sub:'東京，高架橋下的微光。',img:'tokyo_ruins.webp',body:`<p class="lead">城市還在。霓虹不在。道路被植物和積水接管，東京鐵塔孤獨地亮在遠方。</p><p class="desc">你沿著殘破的街道前進，看到路邊有人用舊手機當鏡子，還有人向紅綠燈祈禱。遠處傳來叫賣聲。</p><div class="quote">「前面有人的地方。太好了……應該吧？」</div><span class="tag">世界觀：西元 26XX</span><span class="tag">知識斷層</span><span class="tag">城市仍有殘存系統</span>`},
{tag:'03 / SMALL SANCTUARY',title:'歡迎來到「屁護所」',sub:'安全第一，其他第二。',img:"https://imgix.bustle.com/uploads/image/2023/10/23/67198226-b6e9-40a0-bd37-dbbf7c89eae5-fallout3-8.jpg",body:`<div class="dialog cinematic"><div class="line player"><b class="speaker">玩家</b><span>屁……護所？這是錯字還是惡搞？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>都不是！這是我們祖傳的名字！</span></div><div class="line player"><b class="speaker">玩家</b><span>那現在是西元幾年？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>這裡沒有西元，只有阿元。</span></div><div class="line player"><b class="speaker">玩家</b><span>阿元是誰？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>我兒子啊。</span></div><div class="line player"><b class="speaker">玩家</b><span>……你們這裡有電嗎？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>當然！那根柱子上面掛著好多電線！</span></div><div class="line player"><b class="speaker">玩家</b><span>我是問電線裡面有沒有電。</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>喔，那個就不知道了。你要自己去問它。</span></div></div><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>不好意思，請問這裡是哪裡？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>屁護所。</span></div><div class="line player"><b class="speaker">玩家</b><span>我是問這個地區。</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>屁護所這個地區。</span></div><div class="line player"><b class="speaker">玩家</b><span>……現在西元幾年？</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>這裡沒西元，只有阿元。我兒子。</span></div></div><p class="desc">阿土伯正在用鐵棍敲收音機。每次敲出雜音，他都說：「看！它快要開口了！」</p>`},
{tag:'04 / MEET THE LOCALS',title:'村裡的三位權威人士',sub:'探索 NPC 對話：點擊人物詢問情報。',body:`<p class="desc">三個人都很有自信，但你懷疑這裡的教育制度發生過某些事情。</p><div class="inspect" id="villagers"><button data-villager="0"><img class="npc-thumb" src="https://images.ctfassets.net/rporu91m20dc/460GvtuDviqw24ae2gUKE6/c2e915968e56a5445473e3532f58ce3a/data.images.event.127.FO4FarHarbor_Longfellow_Full.jpg" alt="阿土伯概念參考">阿土伯<br><small>守門人</small></button><button data-villager="1"><img class="npc-thumb" src="https://www.gamerguides.com/assets/media/15/39376/robert_maccready-67386b68.png" alt="阿寶概念參考">阿寶<br><small>科學家</small></button><button data-villager="2"><img class="npc-thumb" src="https://images3.alphacoders.com/618/618275.jpg" alt="阿花概念參考">阿花<br><small>雜貨商</small></button></div><div class="dialog" id="villagerTalk"><div class="line"><b class="speaker">提示</b><span>點擊人物開始對話。至少拜訪兩人。</span></div></div><div class="status" id="villagerStatus">已認識 0 / 3 人</div>`,gate:'villagers'},
{tag:'05 / THE SIX BIG BUTTS',title:'傳說中的六個「大屁屁」',sub:'每座大屁屁只有一位「神仙」。',body:`<div class="dialog cinematic"><div class="line npc"><b class="speaker">阿花</b><span>我跟你講，世界上有六個大屁屁！每個大屁屁都有一位神仙！</span></div><div class="line player"><b class="speaker">玩家</b><span>你見過神仙？</span></div><div class="line npc"><b class="speaker">阿花</b><span>沒有啊！我媽講的。</span></div><div class="line player"><b class="speaker">玩家</b><span>你媽見過？</span></div><div class="line npc"><b class="speaker">阿花</b><span>沒有！她也是聽她媽講的！</span></div><div class="line player"><b class="speaker">玩家</b><span>那消息來源……</span></div><div class="line npc"><b class="speaker">阿花</b><span>我阿嬤以前很少說謊！</span></div><div class="line player"><b class="speaker">玩家</b><span>……那有第七個嗎？</span></div><div class="line npc"><b class="speaker">阿花</b><span>可能有！六個之後就是七個啊！</span></div><div class="line player"><b class="speaker">玩家</b><span>我竟然找不到反駁的理由。</span></div></div><div class="dialog"><div class="line npc"><b class="speaker">阿花</b><span>遠方有六個大屁屁！每個裡面都住一位神仙！</span></div><div class="line player"><b class="speaker">玩家</b><span>六個？那神仙到底會什麼？</span></div><div class="line npc"><b class="speaker">阿花</b><span>什麼都會！聽說還有第七個！</span></div><div class="line player"><b class="speaker">玩家</b><span>你怎麼知道有第七個？</span></div><div class="line npc"><b class="speaker">阿花</b><span>六個後面就是七個啊！</span></div></div><p class="desc">村民口中的「大屁屁」，其實是大型庇護所。六座已知大型庇護所，各由一位高階 AI 使者管理。是否還有更多？尚未確認。</p><div class="status">玩家此時只接收到約 5% 的真實世界資訊。傳聞可能是真的，也可能完全搞錯。</div>`},
{tag:'06 / SURVIVAL NEEDS',title:'先活下去，才能談拯救世界',sub:'一個很現實的問題：你沒錢、沒手機，也沒午餐。',body:`<div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>我可以買點吃的嗎？</span></div><div class="line npc"><b class="speaker">阿花</b><span>可以啊，你拿什麼換？</span></div><div class="line player"><b class="speaker">玩家</b><span>……我有一張信用卡。</span></div><div class="line npc"><b class="speaker">阿花</b><span>塑膠片？我這裡有一整桶。</span></div></div><p class="lead">你決定回到冬眠設施，看看古代人的東西能不能換一頓飯。</p><div class="actions"><button class="action" data-go="7">返回冬眠設施 →</button></div>`},
{tag:'07 / QUEST 01 · EXPLORE',title:'任務一：恭喜您，您還活著！',sub:'探索設施：點擊物品，找出有用的線索。',img:"https://staticdelivery.nexusmods.com/images/1151/173912127-1676508458.jpg",body:`<div class="dialog cinematic"><div class="line npc"><b class="speaker">廣播</b><span>尊貴會員，您已成功退役！請在領取緊急補給前完成離職程序。</span></div><div class="line player"><b class="speaker">玩家</b><span>離職？我不是來睡覺的嗎？</span></div><div class="line npc"><b class="speaker">廣播</b><span>我們珍惜每一位已離開本公司的同仁。</span></div><div class="line player"><b class="speaker">玩家</b><span>我還活著耶！</span></div><div class="line npc"><b class="speaker">廣播</b><span>系統已收到您的正面回饋。</span></div><div class="line player"><b class="speaker">玩家</b><span>你這台機器跟屁護所的人很有得聊。</span></div></div><p class="desc">古老企業的自動管理系統仍在運作。想領緊急補給？先完成「退役滿意度調查」。</p><div class="mini"><h3>🔎 互動：搜索冬眠設施</h3><p>檢查三個位置。找到的線索將加入背包。</p><div class="inspect" id="searchObjects"><button data-find="plant"><img class="object-thumb" src="https://staticdelivery.nexusmods.com/images/1151/173912127-1676508458.jpg" alt="乾枯盆栽所在的設施角落">枯死盆栽</button><button data-find="memo"><img class="object-thumb" src="https://staticdelivery.nexusmods.com/images/1151/2403113-1481484924.jpg" alt="紙本維護便條">維護便條</button><button data-find="terminal"><img class="object-thumb" src="https://images.steamusercontent.com/ugc/2417957458733859379/291E65CFE6C375DE062C6269A6FFC123E8AB15E3/" alt="舊式終端機">舊終端機</button></div><p class="result" id="searchResult">先點擊你想調查的物品。</p><div class="inventory" id="inventory"></div></div>`,gate:'search'},
{tag:'08 / QUEST 01 · BUREAUCRACY',title:'先填問卷，才准活著離開',sub:'互動：企業滿意度調查。',body:`<div class="mini"><h3>📋 冬眠計畫退役問卷</h3><p>您對本次睡眠服務是否滿意？</p><div class="choicegrid" id="surveyChoices"><button class="choice" data-survey="A">A. 非常滿意</button><button class="choice" data-survey="B">B. 滿意</button><button class="choice" data-survey="C">C. 普通</button><button class="choice" data-survey="D">D. 非常滿意（加粗）</button></div><p class="result" id="surveyResult">系統正等待您提供正面回饋。</p></div><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>……怎麼沒有「不滿意」？</span></div><div class="line"><b class="speaker">廣播</b><span>感謝您主動提供改善建議。您的意見非常重要，因此不會影響任何決策。</span></div></div>`,gate:'survey'},
{tag:'09 / QUEST 01 · SUPPLIES',title:'補給櫃：開鎖的方法比密碼還笨',sub:'互動：把線索用在正確的位置。',body:`<div class="dialog cinematic"><div class="line player"><b class="speaker">玩家</b><span>補給櫃還有貨！但要管理員授權？</span></div><div class="line npc"><b class="speaker">廣播</b><span>為保護您的安全，未經授權不得使用緊急救命物資。</span></div><div class="line player"><b class="speaker">玩家</b><span>……那這個櫃子是在防止我活下來嗎？</span></div><div class="line npc"><b class="speaker">廣播</b><span>安全是我們的最高優先事項。</span></div><div class="line player"><b class="speaker">玩家</b><span>我開始懷疑你們的優先順序了。</span></div></div><p class="desc">補給櫃要求管理員授權。你找到一張維護便條：「不要再把備用鑰匙放在盆栽底下。」</p><div class="mini"><h3>🔐 取得生存補給</h3><p>將「備用鑰匙」拖進補給櫃；手機也可先點物品、再點補給櫃。</p><div class="dragchips"><button class="dragchip" draggable="true" data-chip="key">🗝️ 備用鑰匙</button><button class="dragchip" draggable="true" data-chip="card">💳 失效信用卡</button><button class="dragchip" draggable="true" data-chip="leaf">🍂 枯葉</button></div><div class="dropzone" id="supplyDrop" data-drop="supply">📦 緊急補給櫃<br>拖放物品到這裡 / 點擊使用</div><p class="result" id="supplyResult">提示：古代管理員也是人類。</p></div><div class="status">通過後取得：真空口糧、手電筒、工具包，以及一台神祕終端。</div>`,gate:'supply'},
{tag:'10 / SPIRIT AWAKENING',title:'這是……什麼會講話的東西？',sub:'選擇一位先登場的學習精靈（示範兩種性格）。',body:`<p class="desc">你按下古代終端上的 START。投影晃了兩下，一隻奇妙的小生物從螢幕裡冒出來。</p><div class="portrait-pair"><button data-spirit="炎牙" class="selected"><img src="assets/portrait_炎牙.webp" alt="炎牙"><span>🔥 炎牙 Blaze<br><small>急躁、好勝、話很多</small></span></button><button data-spirit="莫奇"><img src="assets/portrait_莫奇.webp" alt="莫奇"><span>🌸 莫奇 Mochi<br><small>慵懶、愛吃、慢半拍</small></span></button></div><div class="dialog" id="spiritTalk"></div><p class="note">正式產品可由玩家先前的行為證據推薦第一位精靈；此處提供兩條可體驗的示範對話。其他四位精靈仍屬同一角色系統。</p>`,gate:'spirit'},
{tag:'11 / QUEST 02 · POWER',title:'任務二：拜託，不要再鼓勵發電機了',sub:'接電任務不是單一選擇題，而是連續的三段操作。',img:"https://shosinnsha9121.up.seesaa.net/image/Fallout204_20170607051507.jpg",body:`<div class="dialog cinematic"><div class="line npc"><b class="speaker">阿寶</b><span>我跟你說，電池沒力要睡覺！我都幫它準備枕頭！</span></div><div class="line player"><b class="speaker">玩家</b><span>你有試過插上充電器嗎？</span></div><div class="line npc"><b class="speaker">阿寶</b><span>有！但是充電器也累了啊！</span></div><div class="line ai"><b class="speaker">精靈</b><span>我提議：我們用氣勢讓發電機動起來！</span></div><div class="line player"><b class="speaker">玩家</b><span>你跟他真是天生一對。</span></div><div class="line npc"><b class="speaker">阿寶</b><span>我有個新想法！我們三個一起對它喊！</span></div><div class="line player"><b class="speaker">玩家</b><span>……先找一下啟動裝置，好嗎？</span></div></div><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>終端電量只剩 3%，得想辦法供電。</span></div><div class="line ai"><b class="speaker" id="spiritName">炎牙</b><span id="powerJoke">全部接上去！一次搞定！……什麼？會跳電？那就跳得帥一點！</span></div></div><div class="mini"><h3>⚡ 階段 1 / 手動打氣</h3><p>備用發電機的啟動壓力不足。連續點擊幫手動泵打氣，達到 100% 才能啟動。</p><button class="action" id="pump">🛠️ 打氣！連點這裡</button><div class="meter"><div class="fill" id="pumpFill"></div></div><p class="result" id="pumpResult">壓力：0%</p></div>`,gate:'pump'},
{tag:'12 / QUEST 02 · HOLD',title:'別鬆手！穩住啟動開關',sub:'互動：按住不放，累積啟動能量。',body:`<p class="desc">壓力夠了，但老式啟動開關接點不穩。需要持續按住，直到系統完成預充電。</p><div class="mini"><h3>🔋 階段 2 / 長按蓄能</h3><button class="hold" id="holdButton">按住我 2.5 秒（滑鼠或手指）</button><div class="meter"><div class="fill" id="holdFill"></div></div><p class="result" id="holdResult">啟動能量：0%</p></div><div class="dialog"><div class="line ai"><b class="speaker" id="holdSpeaker">炎牙</b><span id="holdJoke">別放！別放！欸欸欸你手酸了嗎？我精神上幫你按著！</span></div></div>`,gate:'hold'},
{tag:'13 / QUEST 02 · WIRING',title:'電力只有一份，先救誰？',sub:'互動：拖放電源模組，選擇安全的供電路線。',body:`<div class="dialog cinematic"><div class="line ai"><b class="speaker">精靈</b><span>我宣布！所有線全部接起來！這叫團結！</span></div><div class="line player"><b class="speaker">玩家</b><span>那個娛樂機台就要 200W，發電機只有 150W。</span></div><div class="line ai"><b class="speaker">炎牙</b><span>數字大不是比較厲害嗎？</span></div><div class="line player"><b class="speaker">玩家</b><span>你要不要先幫我把數字看完？</span></div><div class="line npc"><b class="speaker">阿寶</b><span>娛樂機台會唱歌耶！我們先救它好不好？</span></div><div class="line player"><b class="speaker">玩家</b><span>我現在更想救的是你們的腦袋。</span></div></div><p class="desc">發電機可用輸出只有 150W。照明需要 40W，緊急補給系統需要 80W，娛樂機台需要 200W。</p><div class="mini"><h3>🔌 階段 3 / 配電</h3><p>把「150W 電源模組」拖到合適的方案；手機可先點模組再點方案。</p><div class="dragchips"><button class="dragchip" draggable="true" data-chip="power">⚡ 150W 電源模組</button></div><div class="dropzone" data-drop="safe">💡 照明 40W + 📦 補給 80W = 120W</div><div class="dropzone" data-drop="unsafe">🎮 娛樂機台 200W + 💡 照明 40W = 240W</div><p class="result" id="wireResult">先比較需求功率與可用供電。</p></div>`,gate:'wire'},
{tag:'14 / QUEST 02 · TIMING',title:'最後一步：抓準時機！',sub:'互動：看準游標進入綠色區域時按下校準。',body:`<p class="desc">古代同步器仍會抖動。你必須在訊號進入安全窗口時完成校準；失敗可重試，不會懲罰學習。</p><div class="mini"><h3>🎯 階段 4 / 訊號同步</h3><div class="timing-track"><div class="timing-target"></div><div class="timing-cursor" id="cursor"></div></div><button class="action" id="timingButton">校準！按空白鍵也可以</button><p class="result" id="timingResult">等待訊號進入中央綠色區域。</p></div><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>你不是說古代 AI 很厲害嗎？</span></div><div class="line ai"><b class="speaker" id="timingSpeaker">炎牙</b><span id="timingJoke">我很厲害啊！只是這個游標跑得比我還厲害！</span></div></div>`,gate:'timing'},
{tag:'15 / POWER RESTORED',title:'通電！……阿寶居然要拜你為師',sub:'一個小小的修復，改變了聚落對你的看法。',body:`<div class="dialog"><div class="line npc"><b class="speaker">阿寶</b><span>你居然沒對發電機喊加油，它就動了？！</span></div><div class="line player"><b class="speaker">玩家</b><span>對，因為我接對了線。</span></div><div class="line npc"><b class="speaker">阿寶</b><span>原來如此……電線喜歡被尊重。</span></div><div class="line ai"><b class="speaker" id="restoredSpeaker">炎牙</b><span id="restoredJoke">哈哈！第二版計畫大成功！第一版就當沒發生過！</span></div></div><p class="lead">你獲得了照明、補給與穩定的精靈投影。終端終於能讀取殘缺的舊地圖。</p><div class="status">能力證據：觀察故障 → 穩定供電 → 比較負載 → 完成校準。</div>`},
{tag:'16 / ROUTE FINDING',title:'去「大屁屁」的路，到底是哪條？',sub:'互動：從三條道路中挑選可行路線。',img:"https://www.candb.com/site/candb/images/artwork/water-tower_fallout-4_bethesda.jpg",body:`<p class="desc">終端顯示三條路：高架橋斷裂、地下隧道積水、舊貨運路線尚有通行紀錄。阿土伯堅持走「看起來比較有氣勢」的高架橋。</p><div class="mini"><h3>🗺️ 判讀地圖</h3><p>根據環境資訊，選出目前最合理的路線。</p><div class="mapnodes" id="routes"><button data-route="bridge">🌉 高架橋<br><small>橋面已斷</small></button><button data-route="tunnel">🚇 地下隧道<br><small>嚴重積水</small></button><button data-route="cargo">🚚 舊貨運道<br><small>有近期足跡</small></button></div><p class="result" id="routeResult">注意：看起來最直，不一定能通過。</p></div>`,gate:'route'},
{tag:'17 / FIRST KINO',title:'第一次遇見 KINO',sub:'奇諾是這個世界的生物，不是學習精靈。',img:"https://www.candb.com/site/candb/images/artwork/water-tower_fallout-4_bethesda.jpg",body:`<p class="lead">一隻小型奇諾正在啃食廢棄通訊塔旁的金屬碎片。牠沒有攻擊你，只是警戒地抬起頭。</p><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>牠是什麼？</span></div><div class="line ai"><b class="speaker" id="kinoSpeaker">炎牙</b><span id="kinoJoke">不知道！但牠看起來很能打！……也可能只是很餓。</span></div></div><div class="mini"><h3>🐾 你要怎麼做？</h3><div class="choicegrid" id="kinoChoices"><button class="choice" data-kino="observe">👁️ 蹲下觀察牠的行為</button><button class="choice" data-kino="divert">🪙 丟出金屬零件引開牠</button><button class="choice" data-kino="avoid">🚶 保持距離繞路通過</button><button class="choice" data-kino="rush">🏃 大叫一聲衝過去</button></div><p class="result" id="kinoResult">沒有唯一正確答案；每種選擇都會得到不同的回饋。</p></div>`,gate:'kino'},
{tag:'18 / TRUE SANCTUARY',title:'NOUS — The Last Sanctuary',sub:'這不是第七座神殿，而是六座已知大型庇護所之一。',img:'portrait_守典者.webp',body:`<div class="dialog cinematic"><div class="line player"><b class="speaker">玩家</b><span>所以……這裡就是大屁屁？</span></div><div class="line ai"><b class="speaker">炎牙</b><span>哇！好大！果然是大屁屁！</span></div><div class="line ai"><b class="speaker">守典者</b><span>歡迎來到 NOUS，最後的庇護所。</span></div><div class="line player"><b class="speaker">玩家</b><span>終於有一個會正常講話的人了。</span></div><div class="line ai"><b class="speaker">守典者</b><span>「正常」通常只是對熟悉事物的稱呼。</span></div><div class="line player"><b class="speaker">玩家</b><span>……好，收回剛才那句。</span></div></div><p class="lead">你終於看見高聳的穹頂、保存完好的圖書館，以及一位從光中顯現的男子。</p><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>所以這就是……大屁屁？</span></div><div class="line ai"><b class="speaker" id="arrivalSpirit">炎牙</b><span id="arrivalJoke">這麼漂亮的地方，怎麼會叫那個名字啊？！</span></div><div class="line"><b class="speaker">守典者</b><span>名稱通常能反映人們如何理解事物。有時，也反映他們沒有理解的部分。</span></div><div class="line player"><b class="speaker">玩家</b><span>你們這裡講話都要這麼拐彎嗎？</span></div></div><div class="status">守典者 Archivist｜這座庇護所的高階 AI 使者，負責保存知識、重建理解。</div>`},
{tag:'19 / THE ARCHIVIST',title:'「保存答案，不等於保有文明。」',sub:'使者很聰明，但不習慣直接把答案交出去。',img:'envoy_1.webp',body:`<div class="dialog cinematic"><div class="line player"><b class="speaker">玩家</b><span>你知道我是誰？</span></div><div class="line ai"><b class="speaker">守典者</b><span>我知道你從哪裡來。但你是誰，還需要一些時間才能回答。</span></div><div class="line player"><b class="speaker">玩家</b><span>你們是不是有一個謎語訓練班？</span></div><div class="line ai"><b class="speaker">守典者</b><span>我只是避免用簡單的答案，掩蓋複雜的問題。</span></div><div class="line player"><b class="speaker">玩家</b><span>那先回答簡單的：現在到底哪一年？</span></div><div class="line ai"><b class="speaker">守典者</b><span>西元二十七世紀。</span></div><div class="line player"><b class="speaker">玩家</b><span>……那我的外送大概送不到了。</span></div><div class="line ai"><b class="speaker">守典者</b><span>就目前的物流狀態而言，我不建議繼續等待。</span></div></div><div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>所以現在到底是幾年？</span></div><div class="line"><b class="speaker">守典者</b><span>西元二十七世紀。你希望我重複嗎？</span></div><div class="line player"><b class="speaker">玩家</b><span>……重複一次好了。</span></div><div class="line"><b class="speaker">守典者</b><span>即使我重複，時間也不會倒退。</span></div><div class="line player"><b class="speaker">玩家</b><span>我不是要你倒退啦！</span></div></div><p class="desc">守典者展示城市從高度自動化走向系統失修的影像。人類曾擁有大量知識，卻逐漸失去理解、驗證、傳承與修復的能力。AI 保存了資料，無法替所有人重新長出思考能力。</p><div class="quote">「一把沒人懂得修理的工具，究竟是財富，還是遲早會到期的借貸？」</div>`},
{tag:'20 / EPILOGUE',title:'第一道光，從你開始',sub:'序章結束，真正的旅程才剛開始。',img:'portrait_守典者.webp',body:`<div class="dialog"><div class="line player"><b class="speaker">玩家</b><span>所以你們需要我拯救世界？</span></div><div class="line"><b class="speaker">守典者</b><span>我不確定任何一個人能做到那件事。但你已經讓一座沉睡的設施重新運作。</span></div><div class="line player"><b class="speaker">玩家</b><span>那下一步呢？</span></div><div class="line"><b class="speaker">守典者</b><span>遠處有一座熄滅的燈塔。或許可以先從一盞燈開始。</span></div><div class="line player"><b class="speaker">玩家</b><span>……有飯吃嗎？</span></div><div class="line"><b class="speaker">守典者</b><span>有。你終於問了一個我能直接回答的問題。</span></div></div><div class="endpanel"><div class="eyebrow">PROLOGUE COMPLETE</div><div class="bigword" style="font-size:clamp(37px,4vw,75px)">NOUS ✧</div><h2>CHAPTER 01 — THE FIRST LIGHT</h2><p class="desc">學習不是逃離世界，而是讓世界重新發光的開始。</p></div>`}
];

const visualImages={1:"https://miro.medium.com/v2/resize:fit:1400/0*grdtOltLs1Gngd4K",4:"https://www.gamerguides.com/assets/media/15/39376/robert_maccready-67386b68.png",5:"https://www.candb.com/site/candb/images/artwork/water-tower_fallout-4_bethesda.jpg",6:"https://imgix.bustle.com/uploads/image/2023/10/23/67198226-b6e9-40a0-bd37-dbbf7c89eae5-fallout3-8.jpg",8:"https://cdn.mos.cms.futurecdn.net/4e8eb396ce45e61d4f3992ea759c7925.jpg",9:"https://staticdelivery.nexusmods.com/images/1151/173912127-1676508458.jpg",10:'portrait_炎牙.webp',12:"https://shosinnsha9121.up.seesaa.net/image/Fallout204_20170607051507.jpg",13:"https://shosinnsha9121.up.seesaa.net/image/Fallout204_20170607051507.jpg",14:"https://cdn.mos.cms.futurecdn.net/4e8eb396ce45e61d4f3992ea759c7925.jpg",15:"https://shosinnsha9121.up.seesaa.net/image/Fallout204_20170607051507.jpg"};
chapters.forEach((c,i)=>{if(!c.img&&!c.art&&visualImages[i])c.img=visualImages[i]});

// Remove redundant repeated dialogue blocks from the legacy script before creating slides.
[0,3,5,18].forEach(i=>{const temp=document.createElement('div');temp.innerHTML=chapters[i].body;const dialogs=[...temp.querySelectorAll('.dialog')];if(dialogs.length>1){const removeIndex=i===18?0:1;dialogs[removeIndex].remove();chapters[i].body=temp.innerHTML}});
// Enforce exactly one forward navigation control per chapter, before slide DOM creation.
chapters.forEach((c,i)=>{
  const holder=document.createElement('div');holder.innerHTML=c.body;
  holder.querySelectorAll('[data-go]').forEach(button=>{
    const wrapper=button.closest('.actions');
    if(wrapper && wrapper.querySelectorAll('button').length===1)wrapper.remove();

  });
  // Old slide-local completion controls must not coexist with the canonical scene CTA.
  holder.querySelectorAll('[data-scene-next], .story-next, .scene-cta').forEach(el=>el.remove());
  c.body=holder.innerHTML;
});
// Dynamic NPC / spirit conversations remain distinct; no text is repeated in the same scene.
const deck=document.getElementById('deck');
chapters.forEach((c,i)=>{let sec=document.createElement('section');sec.className='slide'+(!c.img&&!c.art?' full':'')+(i===0?' active':'');sec.dataset.i=i;const right=c.img?`<div class="right ${i===19?'contain':''}"><img src="${/^https?:/.test(c.img)?c.img:A+c.img}" alt="${c.title}" loading="${i<2?'eager':'lazy'}"></div>`:c.art?`<div class="right"><div class="sceneart"><div class="sun"></div><div class="skyline"></div><div class="sign">屁護所</div><div class="junk">🛢️</div></div></div>`:'';sec.innerHTML=`<div class="left"><div class="eyebrow">${c.tag}</div><h1>${c.title}</h1><h2>${c.sub}</h2>${c.body}</div>${right}`;
const cta=document.createElement('div');cta.className='scene-cta';cta.innerHTML=`<div class="cta-kicker">${c.gate?'完成此處互動即可繼續旅程':'STORY · CONTINUE'}</div><button type="button" class="action story-next" data-scene-next="${i}">${i===chapters.length-1?'↺ 重新開始故事':(['推開冬眠艙門，出去看看 →','確認自己的記憶，離開設施 →','沿著叫賣聲走向聚落 →','走進屁護所，找人問問 →','向村民打聽大屁屁 →','先找點吃的，想辦法活下去 →','回到冬眠設施找物資 →','進入退役問卷程序 →','前往補給櫃 →','帶著補給，啟動古代終端 →','帶著精靈，尋找電源 →','壓力已足，穩住啟動開關 →','預充電完成，檢查配電 →','確認負載，進行同步校準 →','通電成功，返回聚落 →','向阿寶告別，查找大屁屁路線 →','沿貨運道路出發 →','通過 KINO 的活動區域 →','走入真正的庇護所 →','詢問守典者這個世界的真相 →','前往第一道光 →'][i]||'繼續前進 →')}</button></div>`;
sec.querySelector('.left').appendChild(cta);deck.appendChild(sec)});
deck.querySelectorAll('img').forEach(im=>{im.addEventListener('error',()=>{if(!im.dataset.fallback){im.dataset.fallback='1';im.src='assets/tokyo_ruins.webp'}})});
const slides=[...deck.children];let toastTimer;function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function complete(i){state.done[i]=true;refresh();toast('✓ 任務完成！畫面下方已開啟前往下一場景的入口。')}
function canLeave(i){let c=chapters[i];return !c.gate||!!state.done[i]}
function go(n,force=false){if(n<0||n>=slides.length)return;if(n>state.index&&!force&&!canLeave(state.index)){toast('先完成這頁的互動任務，再繼續冒險。');return}if(n>state.max+1&&!force){toast('這個章節還沒解鎖。');return}slides[state.index].classList.remove('active');state.index=n;state.max=Math.max(state.max,n);slides[n].classList.add('active');slides[n].querySelector('.left').scrollTop=0;refresh();if(n===10)updateSpirit();if(n===14)startTiming();else stopTiming()}
function refresh(){document.querySelectorAll('.scene-cta').forEach((el,i)=>{const gated=!!chapters[i].gate;el.classList.toggle('cta-locked',gated&&!state.done[i]);const btn=el.querySelector('button');btn.disabled=gated&&!state.done[i];if(gated&&!state.done[i])el.querySelector('.cta-kicker').textContent='先完成這個場景的互動';else el.querySelector('.cta-kicker').textContent='✓ 可以前往下一場景';});document.getElementById('count').textContent=String(state.index+1).padStart(2,'0')+' / '+chapters.length;document.getElementById('progressbar').style.width=((state.index+1)/chapters.length*100)+'%';document.getElementById('next').disabled=state.index===chapters.length-1;document.getElementById('prev').disabled=state.index===0;document.getElementById('next').textContent='下一頁 →'}
document.querySelectorAll('[data-scene-next]').forEach(b=>b.onclick=()=>b.dataset.sceneNext==chapters.length-1?location.reload():go(+b.dataset.sceneNext+1));document.getElementById('prev').onclick=()=>go(state.index-1);document.getElementById('next').onclick=()=>{};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
let wheelLast=0;document.addEventListener('wheel',e=>{if(document.getElementById('modal').classList.contains('show'))return;let scrollBox=e.target.closest('.left');if(scrollBox&&scrollBox.scrollHeight>scrollBox.clientHeight+10){if(e.deltaY>0&&scrollBox.scrollTop+scrollBox.clientHeight<scrollBox.scrollHeight-6)return;if(e.deltaY<0&&scrollBox.scrollTop>6)return}if(e.target.closest('.mini')&&e.target.closest('.mini').scrollHeight>e.target.closest('.mini').clientHeight+10)return;if(Date.now()-wheelLast<680)return;wheelLast=Date.now();go(state.index+(e.deltaY>0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(document.getElementById('modal').classList.contains('show')){if(e.key==='Escape')closeOverview();return}if(state.index===14&&e.code==='Space'){e.preventDefault();checkTiming();return}if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(state.index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(state.index-1)}});
let touchStart=null;document.addEventListener('touchstart',e=>{if(e.target.closest('button,.mini,.modal')){touchStart=null;return}touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()}},{passive:true});document.addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.3)return;go(state.index+(dx<0?1:-1))},{passive:true});
function openOverview(){let o=document.getElementById('overview');o.innerHTML=chapters.map((c,i)=>`<button data-overview="${i}" class="${i<=state.max?'done':'locked'}"><div class="smallcaps">${String(i+1).padStart(2,'0')} ${i<=state.max?'●':'○'}</div>${c.title}</button>`).join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.overview;if(i<=state.max){closeOverview();go(i,true)}else toast('尚未解鎖')});document.getElementById('modal').classList.add('show')};function closeOverview(){document.getElementById('modal').classList.remove('show')}document.getElementById('overviewBtn').onclick=openOverview;document.getElementById('closeModal').onclick=closeOverview;
// Opening memory: no right answer.
document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{state.memory=b.dataset.memory;document.querySelectorAll('[data-memory]').forEach(x=>x.classList.toggle('selected',x===b));let texts={A:'你先尋找原因。精靈未來可能會多問你「為什麼」。',B:'你優先關心人。精靈未來可能會留意你的社會互動。',C:'你選擇先行動。精靈未來可能會從任務切入。',D:'你習慣用幽默面對未知。精靈可能會跟你互相吐槽。'};document.getElementById('memoryStatus').textContent=texts[state.memory];complete(1)});
const villageTalk=[`<div class="line npc"><b class="speaker">阿土伯</b><span>收音機要常常敲，它才知道你有在關心它。</span></div><div class="line player"><b class="speaker">玩家</b><span>……它不是寵物耶。</span></div><div class="line npc"><b class="speaker">阿土伯</b><span>那為什麼會叫收「音」機？一定要哄啊！</span></div>`,`<div class="line npc"><b class="speaker">阿寶</b><span>我昨天讓電風扇轉了三秒！科學又往前一步！</span></div><div class="line player"><b class="speaker">玩家</b><span>怎麼做到的？</span></div><div class="line npc"><b class="speaker">阿寶</b><span>我對它說了三次加油。第三次它就轉了！</span></div>`,`<div class="line npc"><b class="speaker">阿花</b><span>電池沒力就放枕頭上，睡一覺就好了。</span></div><div class="line player"><b class="speaker">玩家</b><span>這個方法誰教你的？</span></div><div class="line npc"><b class="speaker">阿花</b><span>阿寶啊！他是村裡最有科學的人！</span></div>`];let met=new Set();document.querySelectorAll('[data-villager]').forEach(b=>b.onclick=()=>{let k=+b.dataset.villager;met.add(k);b.classList.add('done');document.getElementById('villagerTalk').innerHTML=villageTalk[k];document.getElementById('villagerStatus').textContent=`已認識 ${met.size} / 3 人；${met.size>=2?'你已大致了解村民的知識水準。':'至少再拜訪一人。'}`;if(met.size>=2)complete(4)});
const foundText={plant:'你翻開枯死盆栽，找到一把備用鑰匙。古代管理員的安全意識非常現代。',memo:'維護便條：「不要再把備用鑰匙放盆栽底下。」管理員顯然已經放棄了。',terminal:'舊終端機顯示：緊急補給櫃尚有庫存；企業問卷必須先完成。'};
document.querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>{let k=b.dataset.find;state.found.add(k);b.classList.add('done');document.getElementById('searchResult').textContent=foundText[k];document.getElementById('inventory').innerHTML=[...state.found].map(x=>`<span class="item found">✓ ${x==='plant'?'備用鑰匙':x==='memo'?'維護便條':'舊終端機'}</span>`).join('');if(state.found.size===3)complete(7)});
document.querySelectorAll('[data-survey]').forEach(b=>b.onclick=()=>{state.survey=b.dataset.survey;document.querySelectorAll('[data-survey]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('surveyResult').textContent=b.dataset.survey==='D'?'感謝您選擇「非常滿意（加粗）」。公司將永久珍藏這份無比重要的讚美。':'系統：感謝您的正面回饋！您已自動加入五星推薦計畫。';complete(8)});
function chipAction(chip,drop){if(drop==='supply'){if(chip==='key'){document.getElementById('supplyDrop').classList.add('success');document.getElementById('supplyResult').textContent='喀噠！補給櫃打開了。你找到口糧、工具與一台奇怪的終端。';complete(9)}else{document.getElementById('supplyResult').textContent=chip==='card'?'信用卡刷不動。它現在只是一塊很有自信的塑膠。':'枯葉沒有解鎖功能。至少目前沒有。'}}else if(drop==='safe'||drop==='unsafe'){if(chip!=='power')return;if(drop==='safe'){document.querySelector('[data-drop="safe"]').classList.add('success');document.getElementById('wireResult').textContent='成功！120W 不超過 150W，照明與補給系統恢復運作。';complete(13)}else{document.getElementById('wireResult').textContent='啪！保護開關跳脫。240W 超過 150W。娛樂機台只能等下次了。';toast('電力超載！安全開關已保護設備，可再試一次。')}}}
document.querySelectorAll('.dragchip').forEach(chip=>{chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',chip.dataset.chip);state.selectedChip=chip.dataset.chip});chip.onclick=()=>{state.selectedChip=chip.dataset.chip;document.querySelectorAll('.dragchip').forEach(x=>x.classList.toggle('selected',x===chip));toast('已選擇 '+chip.textContent.trim()+'，請點擊目標區域')}});document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',e=>e.preventDefault());zone.addEventListener('drop',e=>{e.preventDefault();chipAction(e.dataTransfer.getData('text/plain'),zone.dataset.drop)});zone.onclick=()=>{if(state.selectedChip)chipAction(state.selectedChip,zone.dataset.drop);else toast('請先選擇要使用的物品')}});
function updateSpirit(){const isFire=state.spirit==='炎牙';const t=isFire?`<div class="line ai"><b class="speaker">炎牙</b><span>終於有人叫醒我！我是超級無敵——欸？電只剩 3%？！我帥氣的自我介紹還沒講完耶！</span></div><div class="line player"><b class="speaker">玩家</b><span>你能幫我嗎？</span></div><div class="line ai"><b class="speaker">炎牙</b><span>能啊！……大概。先找電！有電就有辦法！</span></div>`:`<div class="line ai"><b class="speaker">莫奇</b><span>唔……早安。你是來接我回家嗎？</span></div><div class="line player"><b class="speaker">玩家</b><span>不是，我只是按了開機。</span></div><div class="line ai"><b class="speaker">莫奇</b><span>喔……那你可以再按一次嗎？我還沒準備好起床……咦？怎麼只剩 3% 電？</span></div>`;document.getElementById('spiritTalk').innerHTML=t;document.querySelectorAll('[data-spirit]').forEach(b=>b.classList.toggle('selected',b.dataset.spirit===state.spirit));const lines={powerJoke:isFire?'全部接上去！一次搞定！……什麼？會跳電？那就跳得帥一點！':'電不夠的話……我們要不要先把不重要的東西關掉？比如……我？欸不要真的關！',holdJoke:isFire?'別放！別放！欸欸欸你手酸了嗎？我精神上幫你按著！':'你慢慢按，我幫你數……一……二……欸？我剛剛數到哪？',timingJoke:isFire?'我很厲害啊！只是這個游標跑得比我還厲害！':'我剛剛好像看見綠色……可能是我太想吃抹茶麻糬了。',restoredJoke:isFire?'哈哈！第二版計畫大成功！第一版就當沒發生過！':'亮了耶！我們好棒。那……可以充電睡覺了嗎？',kinoJoke:isFire?'不知道！但牠看起來很能打！……也可能只是很餓。':'牠在吃金屬嗎？那個……我們不要把我的充電線放地上喔。',arrivalJoke:isFire?'這麼漂亮的地方，怎麼會叫那個名字啊？！':'大屁屁……聽起來好像很軟，應該很好睡。',};['powerJoke','holdJoke','timingJoke','restoredJoke','kinoJoke','arrivalJoke'].forEach(id=>document.getElementById(id).textContent=lines[id]);['spiritName','holdSpeaker','timingSpeaker','restoredSpeaker','kinoSpeaker','arrivalSpirit'].forEach(id=>document.getElementById(id).textContent=state.spirit)}document.querySelectorAll('[data-spirit]').forEach(b=>b.onclick=()=>{state.spirit=b.dataset.spirit;updateSpirit();complete(10)});updateSpirit();
// Tap pump: no time pressure, simple game loop.
document.getElementById('pump').onclick=()=>{if(state.done[11])return;state.taps=Math.min(20,state.taps+1);document.getElementById('pumpFill').style.width=(state.taps*5)+'%';document.getElementById('pumpResult').textContent=`壓力：${state.taps*5}% ${state.taps===12?'— 阿寶：要不要對它喊加油？':''}`;if(state.taps>=20){document.getElementById('pump').textContent='✓ 壓力足夠';complete(11)}};
// Hold to charge, supports pointer and keyboard, cancel on release.
let holdRAF=null,holdStart=0;const hb=document.getElementById('holdButton');function holdStop(){if(holdRAF)cancelAnimationFrame(holdRAF);holdRAF=null;if(!state.done[12]){state.hold=0;document.getElementById('holdFill').style.width='0%';document.getElementById('holdResult').textContent='鬆手了！能量流失，重新長按即可。'}}function holdTick(t){if(!holdStart)holdStart=t;state.hold=Math.min(100,(t-holdStart)/2500*100);document.getElementById('holdFill').style.width=state.hold+'%';document.getElementById('holdResult').textContent=`啟動能量：${Math.floor(state.hold)}%`;if(state.hold>=100){hb.textContent='✓ 預充電完成';holdRAF=null;complete(12)}else holdRAF=requestAnimationFrame(holdTick)}hb.addEventListener('pointerdown',e=>{if(state.done[12])return;e.preventDefault();hb.setPointerCapture(e.pointerId);holdStart=0;holdRAF=requestAnimationFrame(holdTick)});hb.addEventListener('pointerup',holdStop);hb.addEventListener('pointercancel',holdStop);hb.addEventListener('lostpointercapture',holdStop);
// Timing game only animates while visible, animation based on RAF timestamp.
let timingRAF=null,phase=0,lastFrame=0;function timingLoop(t){if(state.index!==14||state.done[14]){timingRAF=null;return}if(lastFrame)phase+=(t-lastFrame)*.00072;lastFrame=t;let v=(Math.sin(phase*2*Math.PI-Math.PI/2)+1)/2;document.getElementById('cursor').style.left=(v*100)+'%';timingRAF=requestAnimationFrame(timingLoop)}function startTiming(){if(state.done[14])return;lastFrame=0;timingRAF=requestAnimationFrame(timingLoop)}function stopTiming(){if(timingRAF)cancelAnimationFrame(timingRAF);timingRAF=null;lastFrame=0}function checkTiming(){if(state.done[14])return;let x=parseFloat(document.getElementById('cursor').style.left);if(x>=43&&x<=57){document.getElementById('timingResult').textContent='完美同步！訊號穩定，所有必要設備恢復連線。';stopTiming();complete(14)}else{document.getElementById('timingResult').textContent=`差一點！目前 ${Math.round(x)}%，目標是 43–57%。可以無限重試。`}}document.getElementById('timingButton').onclick=checkTiming;
const routes={bridge:'高架橋斷了。阿土伯說只要跑得夠快就能過去，但你決定不驗證這個理論。',tunnel:'地下隧道已積水，沒有防護設備不適合走。',cargo:'正確！舊貨運道有近期足跡、坡度平緩，而且沒有重大斷裂。'};document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{let k=b.dataset.route;document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('routeResult').textContent=routes[k];if(k==='cargo')complete(16)});
const kinoResponses={observe:'你發現牠只吃含礦物的碎片，並會避開突然的聲音。觀察帶來了一條安全通路。',divert:'牠追著金屬零件跑走了。有效，但你失去了一顆可用螺絲。',avoid:'你保持距離，繞過牠的活動範圍。沒有衝突，也沒有額外發現。',rush:'你大叫衝過去，牠被嚇跑，你也差點跌進水坑。精靈：這樣算誰贏？'};document.querySelectorAll('[data-kino]').forEach(b=>b.onclick=()=>{state.kino=b.dataset.kino;document.querySelectorAll('[data-kino]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('kinoResult').textContent=kinoResponses[state.kino];complete(17)});
refresh();
</script><details class="image-credits"><summary>圖片來源與使用說明</summary><p>你提供的 NOUS 原創圖片：守典者、炎牙、莫奇、東京末世景觀。另採用網路搜尋的《Fallout》遊戲截圖及概念美術作為內部視覺氣氛參考，包括 Bethesda、Cook and Becker、Nexus Mods、GamesRadar、Inverse 等來源。這些第三方圖片不代表 NOUS 原創美術，也不應未經授權用於正式商業產品。</p></details><script>
(function(){
 const memory=new WeakMap();
 const stage=document.getElementById('deck');
 function active(){return document.querySelector('.slide.active')}
 function dialogues(slide){return [...slide.querySelectorAll('.dialog')].filter(d=>d.querySelector('.line'))}
 function prepareDialog(d,reset=false){
   if(reset||!memory.has(d))memory.set(d,0);
   let lines=[...d.querySelectorAll('.line')];
   let idx=Math.min(memory.get(d),lines.length-1);
   lines.forEach((l,i)=>l.classList.toggle('dialog-visible',i===idx));
   let btn=d.querySelector('.dialog-advance');
   if(!btn){btn=document.createElement('button');btn.type='button';btn.className='dialog-advance';d.append(btn)}
   const last=idx===lines.length-1;
   btn.textContent=last?'✓ 對話結束':'繼續對話 ▸';
   btn.disabled=last;
   btn.onclick=()=>{if(memory.get(d)<lines.length-1){memory.set(d,memory.get(d)+1);prepareDialog(d);updateCta()} };
 }
 function dialogDone(d){return memory.has(d)&&memory.get(d)>=[...d.querySelectorAll('.line')].length-1}
 function updateCta(){
   const slide=active();if(!slide)return;
   const ds=dialogues(slide);
   const ready=ds.every(dialogDone);
   const cta=slide.querySelector('.scene-cta');
   if(cta)cta.classList.toggle('cta-dialog-wait',!ready);
 }
 function initSlide(slide){
   dialogues(slide).forEach(d=>prepareDialog(d));
   updateCta();
 }
 // Dialogs generated dynamically by villagers and spirit selection are reset on content change.
 ['villagerTalk','spiritTalk'].forEach(id=>{
   const d=document.getElementById(id);if(!d)return;
   new MutationObserver((mutations)=>{
     if(mutations.every(m=>m.target.classList&&m.target.classList.contains('dialog-advance')))return;
     if(mutations.some(m=>m.addedNodes.length||m.removedNodes.length)){
       if(d.querySelector('.line')&&!d.querySelector('.dialog-advance')){prepareDialog(d,true);updateCta()}
     }
   }).observe(d,{childList:true});
 });
 const observer=new MutationObserver(()=>{const slide=active();if(slide)initSlide(slide)});
 observer.observe(stage,{attributes:true,attributeFilter:['class'],subtree:true});
 document.querySelectorAll('[data-scene-next]').forEach(b=>b.addEventListener('click',e=>{
   const slide=b.closest('.slide');if(dialogues(slide).some(d=>!dialogDone(d))){e.stopImmediatePropagation();e.preventDefault();updateCta()}
 },true));
 // Explicitly stop wheel / arrow / touch from bypassing story lines.
 document.addEventListener('keydown',e=>{
   if(['ArrowRight','PageDown'].includes(e.key)){e.stopImmediatePropagation();e.preventDefault()}
 },true);
 document.addEventListener('wheel',e=>{
   if(e.deltaY>0&&dialogues(active()).some(d=>!dialogDone(d))){e.stopImmediatePropagation();e.preventDefault()}
 },{capture:true,passive:false});
 document.addEventListener('touchend',e=>{
   if(dialogues(active()).some(d=>!dialogDone(d)))e.stopImmediatePropagation()
 },true);
 // No external image may fail invisibly. The source is still in the alt text.
 document.querySelectorAll('img').forEach(img=>{img.addEventListener('error',()=>{
   img.classList.add('image-unavailable');img.style.background='#38434b';img.style.objectFit='contain';
   img.title='外部參考圖片無法載入，請檢查網路連線：'+img.src;
 })});
 initSlide(active());
 window.NOUS_QA={active,dialogues,dialogDone,updateCta};
})();
</script></body></html>
