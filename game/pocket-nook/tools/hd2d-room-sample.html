<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小窩時光 HD-2D 房間樣張</title>
<style>
  :root { --bg: #1b1726; --ink: #f4e8d8; --ink-2: #b6a5ba; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--ink-2); }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; box-shadow: 0 0 0 4px #2e2230, 0 12px 40px rgba(0,0,0,.5); }
  canvas#view { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  button { font: inherit; color: #2e2230; background: #f6c75a; border: 0; padding: 4px 12px; box-shadow: inset 0 0 0 3px #2e2230; cursor: pointer; }
  button.off { background: #4a3f5a; color: var(--ink); }
  ul { color: var(--ink-2); padding-left: 20px; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>HD-2D 房間樣張（解析度 480×360，原本 240×180）</h1>
  <p>像素圖本身精細一倍（每件家具的色階、材質、陰影都重畫），再疊上現代的即時光影：窗光光束、檯燈暖光、柔和陰影、泛光、景深。</p>
  <div class="stage"><canvas id="view" width="960" height="720"></canvas></div>
  <div class="bar" id="bar"></div>
  <ul>
    <li>底層：480×360 的純像素圖（按「只看像素」可以看到沒有光影時的樣子）。</li>
    <li>光影層：環境光＋窗外陽光＋檯燈＋筆電螢幕，照在像素上；陰影只落在地板和牆面。</li>
    <li>後製：泛光（亮的地方微微發光）、上下景深模糊、暗角與色調。灰塵在光束裡飄。</li>
  </ul>
</main>
<script>
'use strict';
const W = 480, H = 360, S = 2;
/* ---------------- colour helpers ---------------- */
const hex = (s, a = 255) => { s = s.replace('#', ''); return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16), a]; };
function hsl(h, s, l, a = 255) {
  h = ((h % 360) + 360) % 360 / 360; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255), a];
}
const mix = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), a[3] == null ? 255 : a[3]];
const hueTo = (h, t, k) => { let d = ((t - h + 540) % 360) - 180; return h + d * k; };
// hue-shifted ramp: shadows lean violet, highlights lean warm yellow
function ramp(h, s, n, l0 = .16, l1 = .9) {
  const out = []; for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1), far = Math.abs(t - .5) * 2;
    out.push(hsl(hueTo(h, t < .5 ? 255 : 52, far * .28), s * (1 - .3 * far), l0 + (l1 - l0) * t)); }
  return out;
}
const INK = hex('#2a1f2d');
/* ---------------- noise ---------------- */
function hash(x, y, s = 0) { let n = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; n = (n ^ (n >>> 13)) * 1274126177 | 0; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s = 0) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const fbm = (x, y, s = 0) => vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 7) * .28 + vnoise(x * 4.3, y * 4.3, s + 13) * .12;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const dith = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16;
// pick from a ramp with ordered dithering between steps -> smooth but still pixel-crisp
// DA = how much ordered dithering blends neighbouring shades (0 = clean colour clusters, used for characters)
let DA = .3;
const pick = (r, t, x, y) => { t = Math.max(0, Math.min(.9999, t)) * (r.length - 1); const i = Math.floor(t), f = t - i; return r[Math.min(r.length - 1, i + (f > .5 + (dith(x, y) - .5) * DA ? 1 : 0))]; };

/* ---------------- pixel buffer ---------------- */
class Buf {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8ClampedArray(w * h * 4); }
  px(x, y, c) {
    x = Math.floor(x); y = Math.floor(y); if (!c || x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    const o = (y * this.w + x) * 4, d = this.d, a = (c[3] == null ? 255 : c[3]) / 255;
    if (a >= 1 || d[o + 3] === 0) { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = a >= 1 ? 255 : Math.round(a * 255); }
    else { d[o] = d[o] + (c[0] - d[o]) * a; d[o + 1] = d[o + 1] + (c[1] - d[o + 1]) * a; d[o + 2] = d[o + 2] + (c[2] - d[o + 2]) * a; d[o + 3] = Math.max(d[o + 3], a * 255); }
    return this;
  }
  get(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; const o = (y * this.w + x) * 4; return this.d[o + 3] ? [this.d[o], this.d[o + 1], this.d[o + 2], this.d[o + 3]] : null; }
  on(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h && this.d[(y * this.w + x) * 4 + 3] > 0; }
  clear(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[(y * this.w + x) * 4 + 3] = 0; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, typeof c === 'function' ? c(x + i, y + j, i, j) : c); return this; }
  hl(x, y, l, c) { return this.rect(x, y, l, 1, c); }
  vl(x, y, l, c) { return this.rect(x, y, 1, l, c); }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry, r = dx * dx + dy * dy; if (r <= 1) this.px(x, y, typeof c === 'function' ? c(x, y, dx, dy, Math.sqrt(r)) : c);
    }
    return this;
  }
  poly(pts, c) {
    const ys = pts.map(p => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
    for (let y = y0; y <= y1; y++) {
      const yc = y + .5, xs = [];
      for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length]; if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax)); }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.ceil(xs[k] - .5); x <= Math.floor(xs[k + 1] - .5); x++) this.px(x, y, typeof c === 'function' ? c(x, y) : c);
    }
    return this;
  }
  line(x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (;;) { this.px(x0, y0, typeof c === 'function' ? c(x0, y0) : c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    return this;
  }
  // "selective outline": the outline takes a darkened tint of the colour next to it (modern pixel-art look)
  outline(k = .62, ink = INK) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.on(x, y)) continue; let n = null;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) { const c = this.get(x + dx, y + dy); if (c && c[3] > 200) { n = c; break; } }
      if (n) add.push([x, y, mix(n, ink, k)]);
    }
    for (const [x, y, c] of add) this.px(x, y, c);
    return this;
  }
  blit(dst, ox, oy) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const o = (y * this.w + x) * 4; if (this.d[o + 3]) dst.px(ox + x, oy + y, [this.d[o], this.d[o + 1], this.d[o + 2], this.d[o + 3]]); } }
  canvas() { const c = document.createElement('canvas'); c.width = this.w; c.height = this.h; const x = c.getContext('2d'), im = x.createImageData(this.w, this.h); im.data.set(this.d); x.putImageData(im, 0, 0); return c; }
}

/* ---------------- palettes ---------------- */
const P = {
  paper: ramp(38, .55, 7, .66, .97), stripe: ramp(30, .45, 6, .58, .9), wood: ramp(27, .58, 8, .14, .78), honey: ramp(32, .62, 8, .2, .8),
  dark: ramp(18, .4, 6, .08, .42), blue: ramp(218, .52, 8, .12, .86), pink: ramp(350, .62, 7, .3, .9), cream: ramp(40, .5, 6, .7, .98),
  green: ramp(118, .42, 7, .12, .72), leaf: ramp(96, .5, 7, .14, .78), sky: ramp(205, .62, 6, .55, .93), gold: ramp(44, .82, 6, .3, .9),
  violet: ramp(255, .4, 7, .1, .7), navy: ramp(232, .5, 6, .08, .42), red: ramp(356, .62, 6, .22, .72), teal: ramp(178, .42, 6, .18, .7),
  skin: ramp(22, .62, 6, .38, .92), hair: ramp(18, .48, 6, .1, .5), orange: ramp(28, .78, 7, .28, .84), grey: ramp(225, .14, 7, .16, .86), steel: ramp(210, .22, 6, .2, .8),
};

/* ---------------- room geometry (2x of the game) ---------------- */
const BW0 = 62, BW1 = 418, FY0 = 194, FY1 = 340, TOP = 20;
const floorX = y => { const t = (y - FY0) / (FY1 - FY0); return [BW0 + (14 - BW0) * t, BW1 + (466 - BW1) * t]; };

function paintRoom() {
  const b = new Buf(W, H);
  // ceiling strip
  b.rect(0, 0, W, TOP, (x, y) => pick(P.stripe, .18 + y / TOP * .25, x, y));
  // back wall: cream paper, soft vertical stripes, tiny flower motif, paper grain
  b.rect(BW0, TOP, BW1 - BW0, FY0 - TOP, (x, y) => {
    const u = (x - BW0) % 28, inStripe = u >= 18 && u < 26, pin = u === 17 || u === 26;
    let t = .62 + (fbm(x * .08, y * .08, 3) - .5) * .12 + (y - TOP) / (FY0 - TOP) * .08;
    if (inStripe) t -= .07; if (pin) t -= .16;
    const motif = !inStripe && (y + (Math.floor((x - BW0) / 28) % 2) * 14) % 28 === 8 && u >= 6 && u <= 10 && Math.abs(u - 8) + Math.abs(((y + (Math.floor((x - BW0) / 28) % 2) * 14) % 28) - 8) <= 2;
    if (motif) return u === 8 ? P.pink[5] : P.stripe[3];
    return pick(inStripe || pin ? P.stripe : P.paper, t, x, y);
  });
  // crown moulding
  b.rect(BW0, TOP, BW1 - BW0, 6, (x, y) => [P.cream[4], P.cream[5], P.cream[3], P.stripe[2], P.stripe[1], P.dark[3]][y - TOP]);
  // side walls
  const side = (left) => b.poly(left ? [[0, 0], [BW0, TOP], [BW0, FY0], [14, FY1], [0, FY1]] : [[W, 0], [BW1, TOP], [BW1, FY0], [466, FY1], [W, FY1]], (x, y) => {
    const d = left ? x : W - 1 - x, u = Math.floor(Math.pow(d / BW0, .8) * 5 * 3) % 3;
    let t = .42 + (fbm(x * .1, y * .07, 9) - .5) * .1 + (y / FY1) * .06 - (u === 2 ? .06 : 0);
    return pick(u === 2 ? P.stripe : P.paper, t, x, y);
  });
  side(true); side(false);
  // wall corners (shadow seam)
  b.vl(BW0 - 1, TOP, FY0 - TOP, P.stripe[1]); b.vl(BW1, TOP, FY0 - TOP, P.stripe[1]);
  // floor planks with perspective
  const rows = []; { let y = FY0, h = 7; while (y < FY1) { rows.push([y, Math.round(h)]); y += Math.round(h); h *= 1.075; } }
  rows.forEach(([ry, rh], ri) => {
    const [xa0, xb0] = floorX(ry), sc = (xb0 - xa0) / (BW1 - BW0);
    const joints = []; let jx = -40 - (ri * 37) % 60; while (jx < 520) { joints.push(jx); jx += 70 + (hash(ri, jx, 5) * 50 | 0); }
    for (let y = ry; y < Math.min(FY1, ry + rh); y++) {
      const [xa, xb] = floorX(y + .5), s2 = (xb - xa) / (BW1 - BW0);
      for (let x = Math.ceil(xa); x < xb; x++) {
        const u = (x - 240) / s2 + 240; let bi = 0; while (bi < joints.length - 1 && u > joints[bi + 1]) bi++;
        const tone = hash(ri, bi, 2), grain = fbm(u * .05, (y - ry) * .9 + ri * 3, 4), knot = vnoise(u * .2, y * .5, ri) > .93;
        let t = .42 + (tone - .5) * .22 + (grain - .5) * .22 + (y - ry) / rh * -.05;
        if (y === ry) t = .12; else if (y === ry + 1) t += .16;
        if (Math.abs(u - joints[bi]) < 1.2 / s2 + .5 && bi > 0) t = .14;
        if (knot) t -= .18;
        b.px(x, y, pick(P.honey, t, x, y));
      }
    }
  });
  // baseboards
  b.rect(BW0, FY0 - 10, BW1 - BW0, 10, (x, y) => { const j = y - (FY0 - 10); return j === 0 ? P.cream[5] : j === 1 ? P.cream[4] : j >= 8 ? P.stripe[1] : pick(P.cream, .55 - j * .03, x, y); });
  b.poly([[BW0, FY0 - 10], [BW0, FY0], [14, FY1], [14, FY1 - 18]], (x, y) => pick(P.cream, .38, x, y));
  b.poly([[BW1, FY0 - 10], [BW1, FY0], [466, FY1], [466, FY1 - 18]], (x, y) => pick(P.cream, .3, x, y));
  // front beam (cross-section of the diorama)
  b.rect(0, FY1, W, H - FY1, (x, y) => { const j = y - FY1; if (j === 0) return P.wood[6]; if (j === 1) return P.wood[5]; if (j > 16) return P.dark[1]; return pick(P.wood, .38 - j * .012 + (fbm(x * .04, j * .6, 11) - .5) * .25, x, y); });
  // braided round rug
  const rcx = 242, rcy = 270, rrx = 66, rry = 23, rugCols = [P.navy[2], P.blue[4], P.blue[6], P.cream[4], P.blue[3], P.navy[3], P.blue[5], P.blue[2]];
  b.ellipse(rcx, rcy, rrx, rry, (x, y, dx, dy, r) => {
    const ring = Math.min(7, Math.floor(r * 8)), ang = Math.atan2(dy, dx), braid = Math.floor((ang * (4 + ring * 5)) + ring * .5) & 1;
    let c = rugCols[7 - ring]; if (braid) c = mix(c, INK, .16); if (r > .97) c = mix(c, INK, .35);

    return c;
  });
  return b;
}

/* ---------------- objects ---------------- */
function sprite(w, h, fn, k, clean) { const s = new Buf(w, h), keep = DA; if (clean) DA = 0; fn(s); DA = keep; s.outline(k); return s; }

function windowSprite() {
  return sprite(124, 96, s => {
    // glass view
    const gx = 22, gy = 10, gw = 80, gh = 74;
    s.rect(gx, gy, gw, gh, (x, y) => pick(P.sky, .95 - (y - gy) / gh * .55, x, y));
    s.ellipse(gx + 60, gy + 16, 7, 7, (x, y, dx, dy, r) => r < .7 ? [255, 252, 228] : [255, 238, 170]);
    for (const [cx, cy, w] of [[gx + 18, gy + 20, 16], [gx + 40, gy + 30, 11]]) { s.ellipse(cx, cy, w, 4, P.cream[5]); s.ellipse(cx - 4, cy - 3, w * .55, 4, [255, 255, 255]); s.hl(cx - w + 2, cy + 3, w * 2 - 4, P.sky[3]); }
    // far hills, trees and a rooftop
    for (let x = gx; x < gx + gw; x++) { const hh = 14 + Math.round(Math.sin(x * .11) * 4 + Math.sin(x * .31) * 2); for (let y = gy + gh - hh; y < gy + gh; y++) s.px(x, y, pick(P.green, .62 - (y - (gy + gh - hh)) / hh * .25, x, y)); }
    for (const [cx, cy, r] of [[gx + 10, gy + 58, 9], [gx + 24, gy + 62, 7], [gx + 70, gy + 60, 10]]) s.ellipse(cx, cy, r, r * .9, (x, y, dx, dy) => pick(P.leaf, .55 - dy * .25 - dx * .1 + (hash(x, y, 3) - .5) * .2, x, y));
    s.poly([[gx + 40, gy + 60], [gx + 50, gy + 52], [gx + 60, gy + 60]], P.red[3]); s.rect(gx + 42, gy + 60, 16, 10, P.cream[3]); s.rect(gx + 48, gy + 63, 4, 7, P.wood[3]);
    // glass reflections
    for (let i = 0; i < 18; i++) { s.px(gx + 6 + i, gy + 30 - i, [255, 255, 255, 140]); s.px(gx + 7 + i, gy + 30 - i, [255, 255, 255, 90]); s.px(gx + 50 + i, gy + 70 - i, [255, 255, 255, 80]); }
    // frame + muntins
    const fr = (x, y, w, h, hl) => s.rect(x, y, w, h, (xx, yy, i, j) => j === 0 || i === 0 ? P.cream[5] : j === h - 1 || i === w - 1 ? P.stripe[1] : P.cream[hl ? 4 : 3]);
    fr(gx - 5, gy - 5, gw + 10, 5); fr(gx - 5, gy + gh, gw + 10, 5); fr(gx - 5, gy - 5, 5, gh + 10); fr(gx + gw, gy - 5, 5, gh + 10);
    fr(gx + gw / 2 - 2, gy, 4, gh, true); fr(gx, gy + gh / 2 - 2, gw, 4, true);
    // sill
    s.rect(gx - 10, gy + gh + 5, gw + 20, 6, (x, y, i, j) => j === 0 ? P.cream[5] : j === 5 ? P.stripe[1] : P.cream[3 + (j < 2 ? 1 : 0)]);
    // curtain rod
    s.rect(2, 3, 120, 3, (x, y, i, j) => j === 0 ? P.gold[5] : P.gold[2 + (2 - j)]); s.ellipse(3, 4.5, 3, 3, P.gold[3]); s.ellipse(121, 4.5, 3, 3, P.gold[3]);
    // curtains: pleated pink fabric, tied back
    const curtain = (x0, flip) => {
      for (let y = 6; y < 92; y++) {
        const tie = 52, pinch = y < tie ? 1 - (y - 6) / (tie - 6) * .45 : .55 + (y - tie) / (92 - tie) * .45, w = Math.round(24 * pinch);
        for (let i = 0; i < w; i++) {
          const x = flip ? x0 + 24 - 1 - i : x0 + i, fold = Math.sin((i / w) * Math.PI * 3.2 + (flip ? 1 : 0)) * .5 + .5;
          let t = .35 + fold * .45 - (y > tie ? .05 : 0); if (i === w - 1) t -= .2;
          s.px(x, y, pick(P.pink, t, x, y));
        }
      }
      const tx = flip ? x0 + 8 : x0 + 4; s.rect(tx, 50, 12, 4, (x, y, i, j) => j === 0 ? P.gold[5] : P.gold[3]); s.px(tx + 6, 54, P.gold[2]);
    };
    curtain(0, false); curtain(100, true);
  });
}
function clockSprite() {
  return sprite(36, 36, s => {
    s.ellipse(18, 18, 17, 17, (x, y, dx, dy, r) => pick(P.wood, .38 - dy * .2 - dx * .1 + (r > .9 ? -.1 : 0), x, y));
    s.ellipse(18, 18, 13, 13, (x, y, dx, dy) => pick(P.cream, .82 - dy * .1, x, y));
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, r = i % 3 ? 11 : 10; s.px(Math.round(18 + Math.sin(a) * r - .5), Math.round(18 - Math.cos(a) * r - .5), i % 3 ? P.stripe[2] : P.dark[2]); if (i % 3 === 0) s.px(Math.round(18 + Math.sin(a) * 11 - .5), Math.round(18 - Math.cos(a) * 11 - .5), P.dark[2]); }
    s.line(17, 17, 12, 13, P.dark[1]); s.line(18, 17, 18, 8, P.dark[1]); s.line(18, 18, 23, 23, P.red[3]); s.ellipse(18, 18, 1.6, 1.6, P.gold[3]);
    for (let i = 0; i < 8; i++) s.px(10 + i, 9 - Math.round(Math.sin(i / 7 * Math.PI) * 2) + 3, [255, 255, 255, 120]);
  });
