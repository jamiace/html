<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小窩時光 Pocket Nook</title>
<meta name="description" content="像素風 Lo-Fi 專注小遊戲：佈置小房間、番茄鐘、待辦清單、便條、音樂播放器和寵物陪伴。">
<meta name="theme-color" content="#d9d0e5">
<link rel="icon" type="image/png" href="assets/sprites/i_heart.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink-2); font: 16px var(--font); z-index: 100; }
</style>
</head>
<body>
<div id="app">
  <header class="hud"></header>
  <main class="stage">
    <div class="room-wrap"><canvas id="room" aria-label="你的小房間。點家具、角色或寵物可以互動"></canvas><div id="overlay"></div></div>
    <div id="editbar" class="editbar" hidden><span>佈置模式：拖曳移動家具，小物可以放上桌面、櫃子和層架</span><button class="chip sm" id="edit-sto" type="button">收納箱</button><button class="chip sm primary" id="edit-done" type="button">完成</button></div>
    <div id="minibar" class="minibar" hidden></div>
  </main>
  <nav class="dock" aria-label="工具列"><div class="dock-inner"></div></nav>
</div>
<div id="pins"></div>
<div id="scrim" hidden></div>
<div id="windows"></div>
<div id="ytpanel" class="ytpanel" hidden>
  <div class="yt-h"><span class="yt-title">YouTube</span><button class="xbtn" id="yt-close" type="button" aria-label="關閉 YouTube 播放器">✕</button></div>
  <div class="yt-box"><div id="yt-player"></div><div class="yt-msg" hidden></div></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="loading" class="loading">小窩準備中…</div>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/sprites_items.js"></script>
<script src="js/sprites_chars.js"></script>
<script src="js/sprites_ui.js"></script>
<script src="js/sprites_themes.js"></script>
<script src="js/sprites_life.js"></script>
<script src="js/catalog.js"></script>
<script src="js/vocab.js"></script>
<script src="js/engine.js"></script>
<script src="js/actors.js"></script>
<script src="js/music.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/life.js"></script>
<script src="js/learn.js"></script>
<script src="js/sprite-loader.js"></script>
<script src="js/main.js"></script>
</body>
</html>
