<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Purr Cozy / 呼嚕小窩</title>
<meta name="description" content="像素風 Lo-Fi 專注小遊戲：佈置小房間、番茄鐘、待辦清單、便條、音樂播放器和寵物陪伴。">
<meta name="theme-color" content="#d9d0e5">
<!-- Root icon files supplied by the site owner. Use the same artwork for browser and home screen. -->
<link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
<link rel="icon" href="icon-32x32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="apple-touch-icon.png?v=2" type="image/png">
<link rel="manifest" href="manifest.webmanifest" type="application/manifest+json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="呼嚕小窩">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink-2); font: 16px var(--font); z-index: 100; }
</style>
<link rel="stylesheet" href="css/cats-typo.css">
<link rel="stylesheet" href="css/furniture-play.css">
</head>
<body class="purr-loading">
<div id="app">
  <header class="hud"></header>
  <main class="stage">
    <div class="room-wrap"><canvas id="room" aria-label="你的小房間。點家具、角色或寵物可以互動"></canvas><div id="overlay"></div></div>
    <div id="editbar" class="editbar" hidden><span>佈置模式：拖曳移動家具，小物可以放上桌面、櫃子和層架</span><button class="chip sm" id="edit-sto" type="button">收納箱</button><button class="chip sm primary" id="edit-done" type="button">完成</button></div>
    <div id="minibar" class="minibar" hidden></div>
  </main>
  <nav class="dock" aria-label="工具列"><div class="dock-inner"></div></nav>
</div>
<div id="pins"></div>
<div id="scrim" hidden></div>
<div id="windows"></div>
<div id="ytpanel" class="ytpanel" hidden>
  <div class="yt-h"><span class="yt-title">YouTube</span><button class="xbtn" id="yt-close" type="button" aria-label="關閉 YouTube 播放器">✕</button></div>
  <div class="yt-box"><div id="yt-player"></div><div class="yt-msg" hidden></div></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="loading" class="loading" role="status" aria-live="polite"><div class="purr-splash"><img src="apple-touch-icon.png" width="132" height="132" alt="呼嚕小窩遊戲圖示"><h1>Purr Cozy</h1><p class="purr-subtitle">呼嚕小窩</p><progress id="load-progress" max="100" value="0" aria-label="載入進度"></progress><div class="purr-load-info"><span id="load-status">正在準備房間…</span><span id="load-percent">0%</span></div><button id="load-retry" type="button" hidden>重新載入</button></div></div>
<script>
(async()=>{try{let build;try{const response=await fetch('version.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);build=await response.json()}catch(error){build=JSON.parse(localStorage.getItem('purr-cozy.cached-build')||'null');if(!build)throw error}window.PURR_EARLY_BUILD=build;const s=document.createElement('script');s.src='js/bootstrap.js?boot='+encodeURIComponent(build.resources?.checksum||build.version);s.onerror=()=>{document.getElementById('load-status').textContent='無法載入 js/bootstrap.js';document.getElementById('load-retry').hidden=false};document.head.append(s)}catch(error){document.getElementById('load-status').textContent=String(error.message);document.getElementById('load-retry').hidden=false}document.getElementById('load-retry').onclick=()=>location.reload()})();
</script>
</body>
</html>
