<style>
  /* Loading screen: everything it needs is in this file, so it shows on the first paint
     (no wait for the stylesheets, no flash while they are swapped to the verified copies). */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  /* Only while loading: afterwards style.css paints the page with the light / dark theme colours. */
  body.purr-loading { margin: 0; overflow: hidden; background: #f6efe8; }
  body.purr-loading #app, body.purr-loading #pins, body.purr-loading #toasts,
  body.purr-loading #windows, body.purr-loading #ytpanel { visibility: hidden; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 16px "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  #loading.loading { z-index: 100000; background: #f6efe8; color: #55435b; padding: 24px; box-sizing: border-box; }
  .purr-splash { width: min(340px,100%); text-align: center; }
  .purr-splash img { display: inline-block; width: clamp(156px,27vh,220px); max-width: 65vw; height: auto; aspect-ratio: 1; border-radius: 26%; box-shadow: 0 12px 36px #65516824; background: #f3d9a6; }
  .purr-splash h1 { font-weight: 700; font-size: clamp(28px,8vw,38px); line-height: 1.2; margin: 22px 0 5px; letter-spacing: .03em; }
  .purr-subtitle { margin: 0 0 30px; letter-spacing: .2em; font-size: 17px; }
  #load-progress { display: block; width: 100%; height: 12px; -webkit-appearance: none; appearance: none; border: 0; border-radius: 20px; overflow: hidden; background: #dccbd8; accent-color: #b78eab; }
  #load-progress::-webkit-progress-bar { background: #dccbd8; border-radius: 20px; }
  #load-progress::-webkit-progress-value { background: #b78eab; border-radius: 20px; transition: width .12s; }
  #load-progress::-moz-progress-bar { background: #b78eab; }
  /* Before the first real progress (version check, resource list) the bar moves instead of sitting empty at 0%. */
  #load-progress:indeterminate { background: linear-gradient(90deg,#dccbd8 0 35%,#b78eab 50%,#dccbd8 65% 100%) 0 0/300% 100%; animation: purr-wait 1.3s linear infinite; }
  #load-progress:indeterminate::-webkit-progress-bar { background: transparent; }
  #load-progress:indeterminate::-moz-progress-bar { background: transparent; }
  @keyframes purr-wait { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { #load-progress:indeterminate { animation: none; background: #dccbd8; } #load-progress::-webkit-progress-value { transition: none; } }
  #load-retry { margin-top: 20px; padding: 10px 20px; border: 1px solid #b78eab; border-radius: 10px; color: #55435b; background: #fff; font: inherit; cursor: pointer; }
  .purr-load-info { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; font-size: 13px; line-height: 1.6; margin-top: 12px; }
</style>
