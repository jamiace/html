<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purr Cozy PNG 素材圖錄</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e7;color:#384d40;font:16px/1.7 system-ui,sans-serif}header{padding:30px max(20px,calc((100vw - 1160px)/2));background:#315747;color:#fff}h1{margin:0;font-size:30px}p{margin:8px 0}.controls{position:sticky;top:0;background:#f6f2e7ed;backdrop-filter:blur(8px);padding:15px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;z-index:1}input,button{font:inherit;padding:9px 14px;border:1px solid #c6cabb;border-radius:8px;background:#fff;color:inherit}input{width:min(480px,100%)}#grid{max-width:1160px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;padding:0 15px}.card{border:1px solid #dedfce;background:#fffdf6;border-radius:13px;padding:15px;min-width:0}.image{height:160px;display:grid;place-items:center;background:#eee9db;border-radius:8px}.image img{image-rendering:pixelated;max-width:100%;max-height:150px;object-fit:contain}.card b{display:block;margin-top:10px}.card small{display:block;overflow-wrap:anywhere;color:#758173}footer{text-align:center;padding:30px}a{color:inherit}</style><header><h1>Purr Cozy · PNG 素材圖錄</h1><p>家具與配色變體 · 點圖片開啟原始 PNG</p></header><div class="controls"><input id="q" aria-label="搜尋家具" placeholder="輸入名稱或素材 ID"><button id="prev">上一頁</button><span id="count"></span><button id="next">下一頁</button></div><main id="grid"></main><footer>圖檔尺寸與層級以 catalog.json 為準。此頁需透過 HTTP／HTTPS 開啟。</footer><script>(async()=>{const c=await(await fetch('../assets/png/catalog.json')).json(),all=Object.entries(c.items);let page=0;const q=document.querySelector('#q'),grid=document.querySelector('#grid');function render(){const query=q.value.toLowerCase(),items=all.filter(([id])=>(id+' '+c.catalog.ITEMS[id].n).toLowerCase().includes(query)),pages=Math.max(1,Math.ceil(items.length/60));page=Math.max(0,Math.min(page,pages-1));grid.replaceChildren();for(const[id,a]of items.slice(page*60,page*60+60)){const card=document.createElement('article');card.className='card';const box=document.createElement('a');box.className='image';box.href='../'+a.image;box.target='_blank';box.rel='noopener';const im=new Image();im.src='../'+a.image;im.alt=c.catalog.ITEMS[id].n;im.loading='lazy';im.style.width=Math.min(a.size[0]*3,140)+'px';box.append(im);const title=document.createElement('b');title.textContent=im.alt;const desc=document.createElement('small');desc.textContent=id+' · '+a.size.join('×')+' · '+a.layer;card.append(box,title,desc);grid.append(card)}document.querySelector('#count').textContent=`${page+1} / ${pages} · ${items.length} 件`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===pages-1}q.oninput=()=>{page=0;render()};document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};render()})().catch(e=>document.querySelector('#grid').textContent='請透過網站或本地伺服器開啟：'+e.message);</script></html>
